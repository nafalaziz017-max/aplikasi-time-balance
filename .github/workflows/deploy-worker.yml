name: Deploy TimeBalance (Aplikasi PWA + Server)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["www/**", "worker/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Uji server & klien (harus lolos semua)
        run: |
          node worker/test/worker.test.mjs
          node worker/test/auth.test.mjs

      - name: Siapkan database D1 (dibuat otomatis bila belum ada, ID diisi otomatis)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() { npx -y wrangler@4 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=a.find(d=>d.name==="timebalance");console.log(x?(x.uuid||x.id):"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx -y wrangler@4 d1 create timebalance; ID=$(find_id); fi
          if [ -z "$ID" ]; then echo "Gagal mendapat ID database. Pastikan token API punya izin D1: Edit."; exit 1; fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          grep database_id wrangler.toml

      - name: Deploy ke Cloudflare (siapkan tabel database lalu unggah aplikasi + server)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: worker
          preCommands: npx wrangler d1 execute timebalance --remote --file=./schema.sql
          secrets: |
            ADMIN_SECRET
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
