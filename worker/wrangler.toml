# TimeBalance — satu Worker: melayani aplikasi PWA (../www) + API (/api/*) + database D1.
name = "timebalance-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "../www"
binding = "ASSETS"
# Permintaan /api/* selalu lewat kode Worker; file aplikasi disajikan langsung (cepat & gratis).
run_worker_first = ["/api/*"]

[vars]
# Asal (origin) yang boleh memanggil API dari luar domain yang sama: aplikasi Android (Capacitor).
# Tambahkan domain lain bila aplikasi web dihosting terpisah.
ALLOWED_ORIGINS = "https://localhost,capacitor://localhost"
# Gambar QRIS yang ditampilkan di aplikasi (file ada di folder www)
QRIS_IMAGE = "/qris.jpeg"
# --- Opsional: pembayaran otomatis QRIS Midtrans (aktif hanya jika secret MIDTRANS_SERVER_KEY diisi) ---
MIDTRANS_ENV = "sandbox"
ENABLED_PAYMENTS = ""
# APP_URL = "https://app.domainanda.com"   # isi bila memakai domain sendiri (untuk halaman kembali dari Midtrans)

[[d1_databases]]
binding = "DB"
database_name = "timebalance-db"
# Isi dengan ID dari: Cloudflare Dashboard → Storage & Databases → D1 → timebalance → Database ID
database_id = "GANTI-ID-DATABASE-D1"

# Rahasia (JANGAN ditulis di sini). Simpan lewat GitHub Secrets / `wrangler secret put`:
#   ADMIN_SECRET          (wajib)  sandi panel admin /admin.html
#   MIDTRANS_SERVER_KEY   (opsional) hanya bila ingin pembayaran otomatis
