<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TimeBalance Token Test</title><style>body{font-family:system-ui;max-width:760px;margin:30px auto;padding:16px}textarea{width:100%;min-height:150px}button{padding:12px 16px;margin-top:10px}.ok{color:#15803d}.bad{color:#b91c1c}</style><h1>TimeBalance — Tes Token</h1><p>Halaman ini memakai Public Key produksi yang sama dengan APK. Tidak membutuhkan Private Key.</p><textarea id=t placeholder="Tempel TB1... di sini"></textarea><br><button id=b>Verifikasi</button><pre id=o></pre><script>
const PUB={kty:"EC",crv:"P-256",x:"AT0Z8kHRr0VzlN6ijRZ_pvRj8gp3TJn71i3C9uTl3xs",y:"7IgJnqrQFa8W-WNoIcFZWdk_ndrrUhFWTWVyNFY9lLA"};const d=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(s.length/4)*4,"=")),c=>c.charCodeAt(0));
async function v(){const o=document.getElementById('o'),m=/^TB1\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/.exec(document.getElementById('t').value.replace(/\s+/g,''));if(!m){o.textContent='FORMAT SALAH';return}try{const k=await crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,d(m[2]),new TextEncoder().encode('TB1.'+m[1]));const p=JSON.parse(new TextDecoder().decode(d(m[1])));o.textContent=ok?'✓ SIGNATURE VALID\nEmail: '+p.n+'\nPaket: '+p.p+'\nHari: '+p.d:'✕ SIGNATURE TIDAK VALID';o.className=ok?'ok':'bad'}catch(e){o.textContent='ERROR: '+e.message;o.className='bad'}}document.getElementById('b').onclick=v;
</script>
