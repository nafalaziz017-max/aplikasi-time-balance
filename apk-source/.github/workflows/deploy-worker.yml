name: Deploy TimeBalance (Aplikasi PWA + Server)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["www/**", "worker/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Uji server & klien (harus lolos semua)
        run: |
          node worker/test/worker.test.mjs
          node worker/test/auth.test.mjs

      - name: Deploy ke Cloudflare (siapkan tabel database lalu unggah aplikasi + server)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: worker
          preCommands: npx wrangler d1 execute timebalance --remote --file=./schema.sql
          secrets: |
            ADMIN_SECRET
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
